
<!DOCTYPE html>
<html>
<head>
    <title>React Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eef2ff;
        }

        .card {
            background: white;
            width: 280px;
            margin: 80px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #aaa;
        }

        h2 {
            color: #4338ca;
        }

        p {
            color: #555;
        }

        button {
            background: #4f46e5;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Divyanka</h2>
        <p><b>Course:</b> Computer Science</p>
        <p>I am a student interested in web development.</p>
        <p>Total Likes: <span id="likes">0</span></p>
        <button id="likeBtn">Like</button>
        <button id="resetBtn">Reset</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
