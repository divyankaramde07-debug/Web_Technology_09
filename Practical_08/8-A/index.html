
<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f0f4f8;
        }
        .box {
            width: 300px;
            margin: 80px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }
        button {
            padding: 8px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
        li { margin: 10px; cursor: pointer; }
        .done { text-decoration: line-through; }
    </style>
</head>
<body>
    <div class="box">
        <h2>To-Do List</h2>
        <input id="task" placeholder="Enter task">
        <button id="add">Add</button>
        <ul id="list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
